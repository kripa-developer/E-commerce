<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaCart | Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true">
      <span class="orb orb-1"></span>
      <span class="orb orb-2"></span>
      <span class="orb orb-3"></span>
    </div>

    <main class="layout single-panel">
      <section class="login-card" aria-labelledby="reset-title">
        <h2 id="reset-title">Reset password</h2>
        <p class="card-subtitle" id="resetSubtitle">Set a new password for your account.</p>

        <form id="resetForm" novalidate>
          <div class="field-group">
            <label for="newPassword">New Password</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" placeholder="Enter your new password" required minlength="8" />
            <div class="strength-wrap" aria-live="polite">
              <div class="strength-track"><div class="strength-fill" id="strengthFill"></div></div>
              <div class="strength-label" id="strengthLabel">Strength: Too short</div>
            </div>
            <small class="error" id="newPasswordError"></small>
          </div>

          <div class="field-group">
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm your new password" required minlength="8" />
            <small class="error" id="confirmPasswordError"></small>
          </div>

          <button type="submit" class="primary-btn" id="resetButton">Update password</button>
          <p class="status" id="resetStatus" role="status" aria-live="polite"></p>
        </form>

        <p class="signup-text">Back to <a href="index.html" class="link-btn">Sign in</a></p>
      </section>
    </main>

    <script>
      const resetForm = document.getElementById('resetForm');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const newPasswordError = document.getElementById('newPasswordError');
      const confirmPasswordError = document.getElementById('confirmPasswordError');
      const resetStatus = document.getElementById('resetStatus');
      const resetButton = document.getElementById('resetButton');
      const resetSubtitle = document.getElementById('resetSubtitle');
      const strengthFill = document.getElementById('strengthFill');
      const strengthLabel = document.getElementById('strengthLabel');

      const params = new URLSearchParams(window.location.search);
      const accountEmail = params.get('email');
      if (accountEmail) {
        resetSubtitle.textContent = `Set a new password for ${accountEmail}.`;
      }

      const strengthMeta = [
        { label: 'Too short', color: 'rgba(255,255,255,0.15)', width: 0 },
        { label: 'Weak', color: '#ff7b90', width: 33 },
        { label: 'Medium', color: '#ffd166', width: 66 },
        { label: 'Strong', color: '#58e6a9', width: 100 },
      ];

      const getStrength = (value) => {
        if (value.length < 8) return 0;
        let score = 1;
        if (/[A-Z]/.test(value) && /[a-z]/.test(value)) score += 1;
        if (/\d/.test(value) && /[^\w\s]/.test(value)) score += 1;
        return Math.min(score, 3);
      };

      const updateStrength = () => {
        const strength = strengthMeta[getStrength(newPasswordInput.value)];
        strengthFill.style.width = `${strength.width}%`;
        strengthFill.style.backgroundColor = strength.color;
        strengthLabel.textContent = `Strength: ${strength.label}`;
      };

      newPasswordInput.addEventListener('input', updateStrength);

      resetForm.addEventListener('submit', (event) => {
        event.preventDefault();
        newPasswordError.textContent = '';
        confirmPasswordError.textContent = '';
        resetStatus.textContent = '';
        resetStatus.className = 'status';

        let valid = true;

        if (newPasswordInput.value.length < 8) {
          newPasswordError.textContent = 'Password must be at least 8 characters.';
          valid = false;
        }

        if (confirmPasswordInput.value !== newPasswordInput.value) {
          confirmPasswordError.textContent = 'Passwords do not match.';
          valid = false;
        }

        if (!valid) {
          resetStatus.textContent = 'Please fix the highlighted fields.';
          resetStatus.classList.add('error');
          return;
        }

        const originalText = resetButton.textContent;
        resetButton.disabled = true;
        resetButton.classList.add('is-loading');
        resetButton.textContent = 'Updating password...';

        setTimeout(() => {
          resetStatus.textContent = 'Password updated successfully. Redirecting to sign in...';
          resetStatus.classList.add('success');
          resetForm.reset();
          updateStrength();
          resetButton.disabled = false;
          resetButton.classList.remove('is-loading');
          resetButton.textContent = originalText;

          setTimeout(() => {
            window.location.href = 'index.html';
          }, 900);
        }, 700);
      });

      updateStrength();
    </script>
  </body>
</html>
