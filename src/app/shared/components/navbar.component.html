<nav class="navbar" [class.scrolled]="scrolled()">
  <div class="nav-inner container">
    <!-- Logo -->
    <a routerLink="/" class="nav-logo">
      <img src="assets/novacart-logo.svg" alt="NovaCart" width="32" height="32" />
      <span>NovaCart</span>
    </a>

    <!-- Search -->
    <div class="nav-search">
      <input
        type="text"
        placeholder="Search products, brands..."
        [(ngModel)]="searchQuery"
        (keyup.enter)="onSearch()"
        class="search-input"
      />
      <button class="search-btn" (click)="onSearch()">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </button>
    </div>

    <!-- Nav links -->
    <div class="nav-links" [class.open]="mobileMenuOpen()">
      <a routerLink="/products" routerLinkActive="active" class="nav-link">Products</a>
      <a routerLink="/products" [queryParams]="{sortBy:'popular'}" class="nav-link">Deals</a>

      <!-- Cart -->
      <a routerLink="/cart" class="nav-cart btn-icon" *ngIf="auth.isLoggedIn()">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span class="cart-badge" *ngIf="cartState.itemCount() > 0">{{ cartState.itemCount() }}</span>
      </a>

      <!-- User menu -->
      <div class="user-menu-wrap" *ngIf="auth.isLoggedIn(); else loginBtn">
        <button class="user-btn" (click)="toggleUserMenu()">
          <span class="user-avatar">{{ auth.user()?.email?.[0]?.toUpperCase() }}</span>
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <div class="user-dropdown" *ngIf="userMenuOpen()" (mouseleave)="closeUserMenu()">
          <div class="user-email">{{ auth.user()?.email }}</div>
          <div class="dropdown-divider"></div>
          <a routerLink="/orders"  class="dropdown-item" (click)="closeUserMenu()">My Orders</a>
          <a routerLink="/profile" class="dropdown-item" (click)="closeUserMenu()">Profile</a>
          <a routerLink="/wishlist" class="dropdown-item" (click)="closeUserMenu()">Wishlist</a>
          <ng-container *ngIf="auth.isAdmin()">
            <div class="dropdown-divider"></div>
            <a routerLink="/admin" class="dropdown-item admin-link" (click)="closeUserMenu()">Admin Dashboard</a>
          </ng-container>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item danger" (click)="logout()">Sign Out</button>
        </div>
      </div>

      <ng-template #loginBtn>
        <a routerLink="/login" class="btn btn-primary btn-sm">Sign In</a>
      </ng-template>
    </div>

    <!-- Mobile toggle -->
    <button class="mobile-toggle btn-icon" (click)="toggleMobileMenu()">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6"  x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>
</nav>
