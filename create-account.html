<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaCart | Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true">
      <span class="orb orb-1"></span>
      <span class="orb orb-2"></span>
      <span class="orb orb-3"></span>
    </div>

    <div id="siteHeader"></div>

    <main class="layout single-panel">
      <section class="login-card" aria-labelledby="create-title">
        <h2 id="create-title">Create account</h2>
        <p class="card-subtitle">Join NovaCart and start shopping smarter.</p>

        <form id="createForm" novalidate>
          <div class="field-group">
            <label for="newUsername">Username</label>
            <input id="newUsername" name="newUsername" type="text" autocomplete="username" placeholder="Choose a username" required minlength="3" />
            <small class="error" id="newUsernameError"></small>
          </div>

          <div class="field-group">
            <label for="newPassword">Password</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" placeholder="Create a password" required minlength="8" />
            <div class="strength-wrap" aria-live="polite">
              <div class="strength-track"><div class="strength-fill" id="strengthFill"></div></div>
              <div class="strength-label" id="strengthLabel">Strength: Too short</div>
            </div>
            <small class="error" id="newPasswordError"></small>
          </div>

          <div class="field-group">
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm password" required minlength="8" />
            <small class="error" id="confirmPasswordError"></small>
          </div>

          <button type="submit" class="primary-btn" id="createButton">Create account</button>
          <p class="status" id="createStatus" role="status" aria-live="polite"></p>
        </form>

        <p class="signup-text">Already registered? <a href="login.html" class="link-btn">Sign in</a></p>
      </section>
    </main>

    <div id="siteFooter"></div>

    <script src="components.js"></script>
    <script>
      NovaComponents.mountHeader('login');
      NovaComponents.mountFooter();
    </script>

    <script>
      const createForm = document.getElementById('createForm');
      const newUsername = document.getElementById('newUsername');
      const newPassword = document.getElementById('newPassword');
      const confirmPassword = document.getElementById('confirmPassword');
      const newUsernameError = document.getElementById('newUsernameError');
      const newPasswordError = document.getElementById('newPasswordError');
      const confirmPasswordError = document.getElementById('confirmPasswordError');
      const createStatus = document.getElementById('createStatus');
      const createButton = document.getElementById('createButton');
      const strengthFill = document.getElementById('strengthFill');
      const strengthLabel = document.getElementById('strengthLabel');

      const strengthMeta = [
        { label: 'Too short', color: 'rgba(255,255,255,0.15)', width: 0 },
        { label: 'Weak', color: '#ff7b90', width: 33 },
        { label: 'Medium', color: '#ffd166', width: 66 },
        { label: 'Strong', color: '#58e6a9', width: 100 },
      ];

      const getStrength = (value) => {
        if (value.length < 8) return 0;
        let score = 1;
        if (/[A-Z]/.test(value) && /[a-z]/.test(value)) score += 1;
        if (/\d/.test(value) && /[^\w\s]/.test(value)) score += 1;
        return Math.min(score, 3);
      };

      const updateStrength = () => {
        const strength = strengthMeta[getStrength(newPassword.value)];
        strengthFill.style.width = `${strength.width}%`;
        strengthFill.style.backgroundColor = strength.color;
        strengthLabel.textContent = `Strength: ${strength.label}`;
      };

      newPassword.addEventListener('input', updateStrength);

      createForm.addEventListener('submit', (event) => {
        event.preventDefault();
        newUsernameError.textContent = '';
        newPasswordError.textContent = '';
        confirmPasswordError.textContent = '';
        createStatus.textContent = '';
        createStatus.className = 'status';

        let valid = true;

        if (newUsername.value.trim().length < 3) {
          newUsernameError.textContent = 'Username must be at least 3 characters.';
          valid = false;
        }

        if (newPassword.value.length < 8) {
          newPasswordError.textContent = 'Password must be at least 8 characters.';
          valid = false;
        }

        if (confirmPassword.value !== newPassword.value) {
          confirmPasswordError.textContent = 'Passwords do not match.';
          valid = false;
        }

        if (!valid) {
          createStatus.textContent = 'Please fix the highlighted fields.';
          createStatus.classList.add('error');
          return;
        }

        const originalButtonText = createButton.textContent;
        createButton.disabled = true;
        createButton.classList.add('is-loading');
        createButton.textContent = 'Creating account...';

        setTimeout(() => {
          localStorage.setItem('novacart.account', JSON.stringify({
            username: newUsername.value.trim(),
            createdAt: new Date().toISOString(),
          }));

          createStatus.textContent = 'Account created successfully. Redirecting to sign in...';
          createStatus.classList.add('success');
          createForm.reset();
          updateStrength();

          setTimeout(() => {
            window.location.href = 'login.html';
          }, 900);

          createButton.disabled = false;
          createButton.classList.remove('is-loading');
          createButton.textContent = originalButtonText;
        }, 700);
      });

      updateStrength();
    </script>
  </body>
</html>
