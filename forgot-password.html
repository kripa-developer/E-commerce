<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaCart | Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true">
      <span class="orb orb-1"></span>
      <span class="orb orb-2"></span>
      <span class="orb orb-3"></span>
    </div>

    <div id="siteHeader"></div>

    <main class="layout single-panel">
      <section class="login-card" aria-labelledby="forgot-title">
        <h2 id="forgot-title">Forgot password</h2>
        <p class="card-subtitle">Enter your account email and we will send reset instructions.</p>

        <form id="forgotForm" novalidate>
          <div class="field-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
            <small class="error" id="emailError"></small>
          </div>

          <button type="submit" class="primary-btn" id="forgotButton">Send reset link</button>
          <p class="status" id="forgotStatus" role="status" aria-live="polite"></p>
        </form>

        <p class="signup-text">Back to <a href="login.html" class="link-btn">Sign in</a></p>
      </section>
    </main>

    <div id="siteFooter"></div>

    <script src="components.js"></script>
    <script>
      NovaComponents.mountHeader('login');
      NovaComponents.mountFooter();
    </script>

    <script>
      const forgotForm = document.getElementById('forgotForm');
      const emailInput = document.getElementById('email');
      const emailError = document.getElementById('emailError');
      const forgotStatus = document.getElementById('forgotStatus');
      const forgotButton = document.getElementById('forgotButton');

      forgotForm.addEventListener('submit', (event) => {
        event.preventDefault();
        emailError.textContent = '';
        forgotStatus.textContent = '';
        forgotStatus.className = 'status';

        const email = emailInput.value.trim();
        const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

        if (!validEmail) {
          emailError.textContent = 'Please enter a valid email address.';
          forgotStatus.textContent = 'Please fix the highlighted field.';
          forgotStatus.classList.add('error');
          return;
        }

        const originalText = forgotButton.textContent;
        forgotButton.disabled = true;
        forgotButton.classList.add('is-loading');
        forgotButton.textContent = 'Sending reset link...';

        setTimeout(() => {
          forgotStatus.innerHTML = `Reset link sent to ${email}. <a href="reset-password.html?email=${encodeURIComponent(email)}" class="link-btn">Reset now</a>`;
          forgotStatus.classList.add('success');
          forgotForm.reset();
          forgotButton.disabled = false;
          forgotButton.classList.remove('is-loading');
          forgotButton.textContent = originalText;
        }, 700);
      });
    </script>
  </body>
</html>
